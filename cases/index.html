<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="小楊屋玖壹">
  <meta property="og:description" content="小楊的案件">
  <meta property="og:image" content="title.jpg">
  <title>🏠 小楊屋玖壹</title>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JMNR3VKQE4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-JMNR3VKQE4', { send_page_view: false });

    /** GA 追蹤工具函式（全域可用，供所有模組呼叫） */
    window.GA = {
      init(modeName) {
        gtag('set', 'user_properties', { user_mode: modeName });
        gtag('event', 'page_view', {
          user_mode: modeName,
          page_title: document.title,
          page_location: window.location.href,
        });
      },
      switchView(view, modeName) {
        gtag('event', 'switch_view', { view_type: view, user_mode: modeName });
      },
      expandCase(item, modeName) {
        gtag('event', 'expand_case', {
          case_id: item.id, case_name: item.案名,
          case_area: item.分區, case_price: item.委託價, user_mode: modeName,
        });
      },
      clickCaseLink(item, modeName) {
        gtag('event', 'click_case_link', { case_id: item.id, case_name: item.案名, user_mode: modeName });
      },
      jumpToMap(item, modeName) {
        gtag('event', 'jump_to_map', { case_id: item.id, case_name: item.案名, user_mode: modeName });
      },
      clickMarker(item, modeName) {
        gtag('event', 'click_marker', { case_id: item.id, case_name: item.案名, case_price: item.委託價, user_mode: modeName });
      },
      popupToList(item, modeName) {
        gtag('event', 'popup_to_list', { case_id: item.id, case_name: item.案名, user_mode: modeName });
      },
      navigate(item, modeName) {
        gtag('event', 'navigate', { case_id: item.id, case_name: item.案名, user_mode: modeName });
      },
      quickTag(tag, modeName) {
        gtag('event', 'quick_tag', { tag_label: tag, user_mode: modeName });
      },
      search(keyword, modeName) {
        if (keyword.length < 2) return;
        gtag('event', 'search', { search_term: keyword, user_mode: modeName });
      },
    };
  </script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- 本系統樣式 -->
  <link rel="stylesheet" href="style/app.css?v=2" />   <!-- 鎖定畫面 / loading -->
  <link rel="stylesheet" href="style/map.css?v=2" />   <!-- 地圖、元件樣式（原有）-->
</head>
<body>

<!-- ══ 鎖定畫面（預設顯示，驗證後隱藏） ══ -->
<div id="lockscreen">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <div class="lock-title">存取受限</div>
    <div class="lock-msg">
      請確認您使用的是正確的連結。<br><br>
      如需協助，請聯絡<br>
      <code>小楊說房</code>
    </div>
  </div>
</div>

<!-- ══ 載入 overlay ══ -->
<div id="loadingOverlay" style="display:none">
  <div class="loading-inner">
    <div class="loading-spinner"></div>
    <div class="loading-text">載入物件資料中…</div>
  </div>
</div>

<!-- ══ 主介面 ══ -->
<div id="app" style="display:none">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" :class="{ 'sidebar-open': sidebarOpen }">
    <div class="sidebar-header">
      <div class="sidebar-header-row">
        <h2 id="sidebarTitle">🏠 小楊房屋</h2>
        <button class="sidebar-close-btn" @click="sidebarOpen = false" aria-label="關閉篩選">✕</button>
      </div>
      <input class="search-input" v-if="view === 'table'" v-model="filters.keyword" placeholder="搜尋案名 / 區域 / 地段…" />
    </div>

    <div class="sidebar-body">

      <!-- 地圖圖層 & 物件顯示模式（只在地圖頁顯示，置頂讓使用者不需要捲動）-->
      <template v-if="view === 'map'">

        <!-- 案件物件顯示模式 -->
        <div class="filter-section">
          <div class="filter-title">案件物件顯示</div>
          <div class="poi-mode-options">
            <label class="poi-radio-row">
              <input type="radio" name="mapObjectMode" value="all"
                     :checked="mapObjectMode === 'all'" @change="setMapObjectMode('all')" />
              顯示全部物件
            </label>
            <label class="poi-radio-row">
              <input type="radio" name="mapObjectMode" value="none"
                     :checked="mapObjectMode === 'none'" @change="setMapObjectMode('none')" />
              不顯示物件
            </label>
            <label class="poi-radio-row" :class="{ disabled: !mapSingleItemId }">
              <input type="radio" name="mapObjectMode" value="single"
                     :disabled="!mapSingleItemId"
                     :checked="mapObjectMode === 'single'" @change="setMapObjectMode('single')" />
              <span>只顯示{{ mapSingleItemName() ? '：' + mapSingleItemName() : '指定物件（先從列表點🗺）' }}</span>
            </label>
          </div>
        </div>

        <!-- 圖層（POI）勾選樹 -->
        <div class="filter-section" v-if="poiConfig.length">
          <div class="filter-title">圖層</div>
          <div class="poi-tree">
            <div class="poi-category-block" v-for="(items, cat) in poiGrouped()" :key="cat">
              <div class="poi-row poi-row-parent"
                   :class="poiCategoryState(cat)"
                   @click="togglePoiCategory(cat)">
                <span class="poi-box"></span>
                <span class="poi-label">{{ cat }}</span>
              </div>
              <div class="poi-children">
                <div class="poi-row"
                     v-for="item in items" :key="item.類型"
                     :class="{ checked: poiChecked[item.類型] }"
                     @click="togglePoiType(item.類型)">
                  <span class="poi-box"></span>
                  <span class="poi-label">{{ item.emoji }} {{ item.類型 }}</span>
                  <span class="poi-spinner" v-if="poiLoading[item.類型]">⏳</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- 圖層設定讀取中（尚未載入完）-->
        <div class="filter-section" v-else>
          <div class="filter-title">圖層</div>
          <div style="font-size:12px;color:var(--text2);padding:4px 2px">⏳ 讀取圖層設定中…</div>
        </div>

        <hr class="sidebar-divider" />
      </template>

      <!-- 一般篩選 —— 只在列表頁顯示，地圖模式不顯示篩選功能 -->
      <template v-if="view === 'table'">

        <!-- 快速篩選 -->
        <div class="filter-section">
          <div class="filter-title">快速篩選</div>
          <div class="quick-tags">
            <div
              v-for="tag in modeConfig.quickTags"
              :key="tag.value"
              class="quick-tag"
              :class="{ active: filters.quickValue === tag.value }"
              @click="quickType(tag.value, tag.key)"
            >{{ tag.label }}</div>
          </div>
        </div>

        <!-- 特殊篩選（staff only，有資料才顯示） -->
        <div class="filter-section"
             v-if="modeConfig._name === 'staff' && (expiringSoonCount > 0 || soldData.length > 0)">
          <div class="filter-title">特殊篩選</div>
          <div class="special-filter-group">
            <div
              v-if="expiringSoonCount > 0"
              class="special-filter-btn"
              :class="{ active: specialFilter === 'expiring', 'expire-active': specialFilter === 'expiring' }"
              @click="setSpecialFilter('expiring')"
            >
              <span class="sf-dot sf-dot-orange"></span>
              <span class="sf-label">即將到期</span>
              <span class="sf-count">{{ expiringSoonCount }}</span>
            </div>
            <div
              v-if="soldData.length > 0"
              class="special-filter-btn"
              :class="{ active: specialFilter === 'sold', 'sold-active': specialFilter === 'sold' }"
              @click="setSpecialFilter('sold')"
            >
              <span class="sf-dot sf-dot-gray"></span>
              <span class="sf-label">已售物件</span>
              <span class="sf-count">{{ soldData.length }}</span>
            </div>
          </div>
        </div>

        <!-- 縣市 -->
        <div class="filter-section" v-if="modeConfig.filters.city">
          <div class="filter-title">縣市</div>
          <div class="checkbox-grid">
            <label class="checkbox-item" v-for="city in cityOptions" :key="city">
              <input type="checkbox" v-model="filters.citys" :value="city" />{{ city }}
            </label>
          </div>
        </div>

        <!-- 行政區 -->
        <div class="filter-section" v-if="modeConfig.filters.area">
          <div class="filter-title">行政區</div>
          <div class="checkbox-grid">
            <label class="checkbox-item" v-for="area in areaOptions" :key="area">
              <input type="checkbox" v-model="filters.areas" :value="area" />{{ area }}
            </label>
          </div>
        </div>

        <!-- 村里 -->
        <div class="filter-section" v-if="modeConfig.filters.village">
          <div class="filter-title">村里</div>
          <div class="checkbox-grid">
            <label class="checkbox-item" v-for="village in villageOptions" :key="village">
              <input type="checkbox" v-model="filters.villages" :value="village" />{{ village }}
            </label>
          </div>
        </div>

        <!-- 建物型態 -->
        <div class="filter-section" v-if="modeConfig.filters.buildType">
          <div class="filter-title">建物型態</div>
          <div class="checkbox-grid">
            <label class="checkbox-item" v-for="bt in buildTypeOptions" :key="bt">
              <input type="checkbox" v-model="filters.buildTypes" :value="bt" />{{ bt }}
            </label>
          </div>
        </div>

        <!-- 房間數 -->
        <div class="filter-section" v-if="modeConfig.filters.rooms">
          <div class="filter-title">房間數</div>
          <div class="checkbox-grid">
            <label class="checkbox-item" v-for="r in roomOptions" :key="r">
              <input type="checkbox" v-model="filters.rooms" :value="r" />{{ r }}房
            </label>
          </div>
        </div>

        <!-- 座向 -->
        <div class="filter-section" v-if="modeConfig.filters.direction">
          <div class="filter-title">座向</div>
          <div class="checkbox-grid">
            <label class="checkbox-item" v-for="r in directionOptions" :key="r">
              <input type="checkbox" v-model="filters.directions" :value="r" />{{ r }}
            </label>
          </div>
        </div>

        <!-- 使用分區 -->
        <div class="filter-section" v-if="modeConfig.filters.usage">
          <div class="filter-title">使用分區</div>
          <div class="checkbox-grid">
            <label class="checkbox-item" v-for="u in usageOptions" :key="u">
              <input type="checkbox" v-model="filters.usages" :value="u" />{{ u }}
            </label>
          </div>
        </div>

        <!-- 總價 -->
        <div class="filter-group" v-if="modeConfig.filters.price">
            <label class="filter-label">總價（萬）</label>
            <div class="range-row">
                <input type="number" class="range-input" placeholder="最低" v-model="filters.priceMin" />
                <span class="range-separator">~</span>
                <input type="number" class="range-input" placeholder="最高" v-model="filters.priceMax" />
            </div>
        </div>

        <!-- 單價 -->
        <div class="filter-group" v-if="modeConfig.filters.unitPrice">
            <label class="filter-label">單價（萬/坪）</label>
            <div class="range-row">
                <input type="number" class="range-input" placeholder="最低" v-model.number="filters.unitPriceMin" />
                <span class="range-separator">~</span>
                <input type="number" class="range-input" placeholder="最高" v-model.number="filters.unitPriceMax" />
            </div>
        </div>

        <!-- 總坪數 -->
        <div class="filter-group" v-if="modeConfig.filters.ping">
            <label class="filter-label">總坪數</label>
            <div class="range-row">
                <input type="number" class="range-input" placeholder="最低" v-model="filters.pingMin" />
                <span class="range-separator">~</span>
                <input type="number" class="range-input" placeholder="最高" v-model="filters.pingMax" />
            </div>
        </div>

        <!-- 室內坪數 -->
        <div class="filter-group" v-if="modeConfig.filters.interiorPing">
            <label class="filter-label">室內坪數</label>
            <div class="range-row">
                <input type="number" class="range-input" placeholder="最低" v-model="filters.interiorPingMin" />
                <span class="range-separator">~</span>
                <input type="number" class="range-input" placeholder="最高" v-model="filters.interiorPingMax" />
            </div>
        </div>

        <!-- 土地坪數 -->
        <div class="filter-group" v-if="modeConfig.filters.land">
            <label class="filter-label">土地坪數</label>
            <div class="range-row">
                <input type="number" class="range-input" placeholder="最低" v-model.number="filters.landMin" />
                <span class="range-separator">~</span>
                <input type="number" class="range-input" placeholder="最高" v-model.number="filters.landMax" />
            </div>
        </div>

        <!-- 車位數量 -->
        <div class="filter-group" v-if="modeConfig.filters.parking">
            <label class="filter-label">車位數量</label>
            <div class="range-row">
                <input type="number" class="range-input" placeholder="最低" v-model.number="filters.parkingMin" />
                <span class="range-separator">~</span>
                <input type="number" class="range-input" placeholder="最高" v-model.number="filters.parkingMax" />
            </div>
        </div>

        <!-- 屋齢 -->
        <div class="filter-group" v-if="modeConfig.filters.ages">
            <label class="filter-label">屋齢</label>
            <div class="range-row">
                <input type="number" class="range-input" placeholder="最低" v-model.number="filters.agesMin" />
                <span class="range-separator">~</span>
                <input type="number" class="range-input" placeholder="最高" v-model.number="filters.agesMax" />
            </div>
        </div>

        <button class="reset-btn" @click="resetFilters">清除篩選</button>

      </template>

    </div>
  </aside>

  <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="sidebarOpen = false"></div>

  <!-- ── MAIN ── -->
  <main class="main">

    <!-- Topbar -->
    <div class="topbar">
      <button class="filter-toggle-btn" @click="sidebarOpen = true">
        🔍 篩選
        <span class="filter-toggle-badge" v-if="filteredData.length !== rawData.length">{{ filteredData.length }}</span>
      </button>
      <div class="topbar-title">物件資料庫</div>
      <span class="summary-pill">
        📦 {{ filteredData.length }} 筆｜
        均價 {{ averagePrice }} 萬｜
        中位 {{ medianPrice }} 萬
        <template v-if="modeConfig.showSummaryDetail">
          ｜總價 {{ totalPrice }} 萬
          ｜最高業績 {{ maxPerformance }} 萬
        </template>
      </span>
      <div class="topbar-right">
        <select class="sort-select" v-model="sortKey">
          <option value="price_desc">價格高→低</option>
          <option value="price_asc">價格低→高</option>
          <option value="unit_price_desc">單價高→低</option>
          <option value="unit_price_asc">單價低→高</option>
          <option value="ping_desc">坪數大→小</option>
          <option value="ping_asc">坪數小→大</option>
          <option value="land_desc">地坪大→小</option>
          <option value="land_asc">地坪小→大</option>
          <option value="id_desc">編號大→小</option>
          <option value="id_asc">編號小→大</option>
        </select>
        <div class="tab-group">
          <button class="tab-btn" :class="{ active: view === 'table' }" @click="switchView('table')">📋 列表</button>
          <button class="tab-btn" :class="{ active: view === 'map' }"   @click="switchView('map')">🗺 地圖</button>
        </div>
        <!-- tools.js 會在此注入「🔧 工具連結」按鈕（staff 模式） -->
      </div>
    </div>

    <!-- TABLE VIEW -->
    <div class="table-container" v-show="view === 'table'">
      <table>
        <thead>
          <tr>
            <th style="width:160px">案名</th>
            <th style="width:80px">位置</th>
            <th v-if="modeConfig._name === 'staff'" style="width:90px">委託</th>
            <th style="width:80px">總價</th>
            <th style="width:70px">單價</th>
            <th style="width:80px">格局</th>
            <th style="width:120px">建物</th>
            <th v-if="modeConfig.columns.landPing"  style="width:60px">地坪</th>
            <th v-if="modeConfig.columns.usage"     style="width:70px">使用分區</th>
            <th style="width:70px">建物型態</th>
            <th v-if="modeConfig.columns.direction" style="width:70px">座向</th>
            <th v-if="modeConfig.canViewDetail" style="width:70px">操作</th>
          </tr>
        </thead>
        <tbody>
          <template v-for="item in filteredData" :key="item.id">

            <!-- 資料列 -->
            <tr :data-id="item.id"
                :class="{
                  'row-expiring': specialFilter !== 'expiring' && specialFilter !== 'sold' && contractStatus(item) && contractStatus(item).cls !== 'contract-ok',
                  'row-sold': specialFilter === 'sold'
                }">
              <td>
                <div>
                  <a
                    v-if="item.圖片"
                    :href="`https://dennytlyang666.github.io/house/report/${item.id}`"
                    target="_blank"
                    class="title-link"
                  >{{ item.案名 }}</a>
                  <span v-else :title="item.id">{{ item.案名 }}</span>
                </div>

                <!-- 開發資訊（staff / yang 模式） -->
                <div style="font-size:11px;color:#999;margin-top:2px;">
                  <span v-if="modeConfig.columns.dev" >{{ item.開發 }}&nbsp;{{ item.開發備註 }}</span>
                  <template v-if="modeConfig.showLinks">
                    <a :href="item.廣告" target="_blank" rel="noopener"
                       v-if="item.廣告" style="font-size:12px;color:var(--accent);">
                      <i class="fa-brands fa-facebook"></i>
                    </a>&nbsp;
                    <a :href="item.YouTube" target="_blank" rel="noopener"
                       v-if="item.YouTube" style="font-size:12px;color:var(--accent);">
                      <i class="fa-brands fa-youtube"></i>
                    </a>&nbsp;
                  </template>
                  <a v-if="modeConfig.showMapIcon && item.lat && item.lng"
                     @click="jumpToMap(item)" style="cursor:pointer">
                    <i class="fa-solid fa-location-dot"></i>
                  </a>
                </div>

                <!-- 在「查看地圖」的 </a> 後面接 -->
                <template v-if="item.等級">
                  <span v-if="item.等級 === 'A'" style="display:inline-flex;align-items:center;gap:2px">
                    <span class="apple-dot"></span>
                    <span class="grade-A-shine">Apple</span>
                  </span>
                  <span v-else-if="item.等級 === 'B'" style="font-size:13px">⭐ B</span>
                  <span v-else-if="item.等級 === 'C'" style="font-size:13px">🔵 C</span>
                </template>
              </td>

              <td style="font-size:12px">
                {{ item.縣市 }} {{ modeConfig.filters.village ? (item.村里 || item.分區) : item.分區 }}<br>
                <span v-if="modeConfig.showFullAddress" style="color:#aaa">{{ item.地址 || (item.地段 + item.地號) }}</span>
                <span v-else style="color:#aaa">{{ item.位置 || item.地段 }}</span>
              </td>

              <!-- 委託日期欄（staff only） -->
              <td v-if="modeConfig._name === 'staff'" style="font-size:11px;white-space:nowrap">
                <template v-if="specialFilter === 'sold'">
                  <span class="contract-badge contract-sold">成交</span>
                </template>
                <template v-else-if="item.委託末">
                  <div style="color:#999">{{ item.委託末 }}</div>
                  <div v-if="contractStatus(item)" :class="'contract-badge ' + contractStatus(item).cls">
                    {{ contractStatus(item).label }}
                  </div>
                </template>
                <span v-else style="color:#ccc">—</span>
              </td>

              <td class="price">{{ item.委託價 }}萬</td>
              <td class="price">
                  <div>{{ unitPrice(item) }}萬</div>
<!--                  <div>{{ Number(item.委託價 / item.建物坪數).toFixed(2) }}萬</div>-->
              </td>
              <td>
                  <div>{{ item.格局 }}</div>
                  <div v-if="parkingLabel(item)" style="font-size:11px;color:#888">{{ parkingLabel(item) }}</div>
              </td>
              <td>
                  <div v-if="item.總坪數">
                      <div>總共 {{ Number(item.總坪數).toFixed(2) }}</div>
                      <div>建物 {{ Number(item.建物坪數).toFixed(2) }}</div>
                      <div>室內 {{ Number(item.室內坪數).toFixed(2) }}</div>
                      <div>主建 {{ Number(item.主建物).toFixed(2) }}</div>
                      <div v-if="item.屋齡">{{ item.屋齡 }}年</div>
                  </div>
              </td>
              <td v-if="modeConfig.columns.landPing">{{ item.土地坪數 || '-' }}</td>
              <td v-if="modeConfig.columns.usage">
                  <div>{{ item.使用分區 || '-' }}</div>
                  <div>{{ item.主要用途 || '-' }}</div>
              </td>
              <td>{{ item.建物型態 }}</td>
              <td v-if="modeConfig.columns.direction">{{ item.座向 || '-' }}</td>
              <td v-if="modeConfig.canViewDetail">
                <span class="expand-btn" @click="toggleExpand(item.id)">
                  {{ isExpanded(item.id) ? '▲收合' : '▼詳細' }}
                </span>
              </td>
            </tr>

                        </div>
                      </template>
                    </div>

                    <!-- ⑭ 買方搜尋關鍵字（內部用，新格式才有） -->
                    <div class="detail-card" v-if="modeConfig.detailCards.marketing && searchKeywords(item).length">
                      <div class="detail-title">🔑 買方搜尋關鍵字</div>
                      <div class="detail-tag-row">
                        <span class="detail-tag tag-keyword" v-for="k in searchKeywords(item)" :key="k">{{ k }}</span>
                      </div>
                    </div>

                    <!-- ⑮ 國土測繪查詢（staff only，按鈕觸發，快取結果） -->
                    <div class="detail-card detail-card-wide" v-if="modeConfig.detailCards.marketing">
                      <div class="detail-title">🏛 國土測繪資訊</div>
                      <div v-if="!nlscCache[item.id] && !nlscLoading[item.id]">
                        <button class="nlsc-query-btn" @click="queryNlsc(item)">
                          查詢土地使用分區 / 地籍資訊
                        </button>
                        <div class="nlsc-hint">資料來源：內政部國土測繪中心（免費，即時查詢）</div>
                      </div>
                      <!-- 國土功能分區圖：各縣市各自劃設、進度不一，無統一 WMS 可套疊，
                           故連到官方查詢系統讓使用者依縣市自行查詢 -->
                      <a class="nlsc-query-btn nlsc-zoning-btn"
                         :href="zoningQueryUrl()" target="_blank" rel="noopener">
                        🗾 國土功能分區圖查詢（依縣市開啟官方系統）
                      </a>
                      <div class="nlsc-hint">資料來源：內政部國土管理署（各縣市進度不同，僅供參考，以縣市政府公告為準）</div>
                      <div v-if="nlscLoading[item.id]" class="nlsc-loading">⏳ 查詢中，請稍候…</div>
                      <div v-if="nlscCache[item.id]">
                        <!-- 查詢失敗 -->
                        <div v-if="nlscCache[item.id].error" class="nlsc-error">
                          ⚠️ {{ nlscCache[item.id].error }}
                        </div>
                        <!-- 土地使用分區 -->
                        <div v-if="nlscCache[item.id].landUse" class="nlsc-section">
                          <div class="detail-sub-title">📐 土地使用分區</div>
                          <div class="detail-row-2">
                            <div class="detail-item" v-if="nlscCache[item.id].landUse.使用分區">
                              <strong>使用分區：</strong>{{ nlscCache[item.id].landUse.使用分區 }}
                            </div>
                            <div class="detail-item" v-if="nlscCache[item.id].landUse.都市計畫案">
                              <strong>都市計畫：</strong>{{ nlscCache[item.id].landUse.都市計畫案 }}
                            </div>
                            <div class="detail-item" v-if="nlscCache[item.id].landUse.容積率">
                              <strong>容積率：</strong>{{ nlscCache[item.id].landUse.容積率 }}%
                            </div>
                            <div class="detail-item" v-if="nlscCache[item.id].landUse.建蔽率">
                              <strong>建蔽率：</strong>{{ nlscCache[item.id].landUse.建蔽率 }}%
                            </div>
                            <div class="detail-item" v-if="nlscCache[item.id].landUse.使用地類別">
                              <strong>使用地類別：</strong>{{ nlscCache[item.id].landUse.使用地類別 }}
                            </div>
                          </div>
                        </div>
                        <!-- 地籍資料 -->
                        <div v-if="nlscCache[item.id].landInfo" class="nlsc-section">
                          <div class="detail-divider"></div>
                          <div class="detail-sub-title">📋 地籍資料</div>
                          <div class="detail-row-2">
                            <div class="detail-item" v-if="nlscCache[item.id].landInfo.公告地價 !== '-'">
                              <strong>公告地價：</strong>{{ nlscCache[item.id].landInfo.公告地價 }} 元/㎡
                            </div>
                            <div class="detail-item" v-if="nlscCache[item.id].landInfo.公告現值 !== '-'">
                              <strong>公告現值：</strong>{{ nlscCache[item.id].landInfo.公告現值 }} 元/㎡
                            </div>
                            <div class="detail-item" v-if="nlscCache[item.id].landInfo.土地面積 !== '-'">
                              <strong>土地面積：</strong>{{ nlscCache[item.id].landInfo.土地面積 }} ㎡
                            </div>
                            <div class="detail-item" v-if="nlscCache[item.id].landInfo.公有私有 !== '-'">
                              <strong>公有/私有：</strong>{{ nlscCache[item.id].landInfo.公有私有 }}
                            </div>
                          </div>
                        </div>
                        <!-- 重新查詢 -->
                        <button class="nlsc-requery-btn" @click="nlscCache = {...nlscCache, [item.id]: null}; queryNlsc(item)">
                          🔄 重新查詢
                        </button>
                      </div>
                    </div>

                  </div>
                </div>
              </td>
            </tr>

          </template>

        </tbody>
      </table>
    </div>

    <!-- MAP VIEW (v-show 而非 v-if：讓 #map 永遠在 DOM 裡，Leaflet 才找得到容器) -->
    <div class="map-view" v-show="view === 'map'">
      <div class="map-overlay-stats">
        <div class="map-stat-pill">篩選結果 <strong>{{ filteredData.length }}</strong> 筆</div>
        <div class="map-stat-pill">均價 <strong>{{ averagePrice }} 萬</strong></div>
        <div class="map-stat-pill">中位數 <strong>{{ medianPrice }} 萬</strong></div>
      </div>
      <div class="map-legend">
        <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#22c55e,#16a34a)"></span>&lt;1000萬</div>
        <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#3b82f6,#2563eb)"></span>1000-3000萬</div>
        <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#f97316,#ea6c00)"></span>3000-8000萬</div>
        <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#ef4444,#dc2626)"></span>8000萬+</div>
      </div>
      <div id="map"></div>
    </div>

  </main>
</div><!-- /#app -->

<!-- ══ JS：依賴順序載入 ══ -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="./js/config.js"></script>    <!-- SITE_CONFIG -->
<script src="./js/data.js"></script>      <!-- YangData：資料載入 / 篩選 / 統計 -->
<script src="./js/app-init.js"></script>  <!-- hash 驗證 / 解密函式 / GA init -->
<script src="./js/app-map.js"></script>   <!-- MapMethods 物件 -->
<script src="./js/poi.js"></script>       <!-- PoiMethods：圖層（POI）勾選邏輯 -->
<script src="./js/nlsc.js"></script>      <!-- NlscMethods：國土測繪中心 API 查詢 -->
<script src="./js/filters.js"></script>   <!-- YangFilters：filters 狀態 / 快速篩選 / 清除 -->
<script src="./js/app-vue.js"></script>   <!-- Vue createApp：組合以上模組 -->
<script src="./js/tools.js"></script>     <!-- Staff 工具連結面板（自動在 staff 模式掛載） -->

</body>
</html>
